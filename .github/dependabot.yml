version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    versioning-strategy: increase
    groups:
      radix-ui:
        patterns:
          - "@radix-ui/*"
      framer-motion:
        patterns:
          - "framer-motion"
      next:
        patterns:
          - "next"
          - "eslint-config-next"
      prisma:
        patterns:
          - "prisma"
          - "@prisma/client"
      testing:
        patterns:
          - "@testing-library/*"
          - "vitest"
          - "jsdom"
          - "msw"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    groups:
      actions:
        patterns:
          - "*"
