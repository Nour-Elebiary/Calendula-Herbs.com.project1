name: CI

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      matrix:
        node-version: [20, 22]
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      NEXTAUTH_SECRET: placeholder
      NEXTAUTH_URL: http://localhost:3000
      ADMIN_EMAIL: admin@example.com
      RESEND_API_KEY: placeholder
      CLOUDINARY_CLOUD_NAME: placeholder
      CLOUDINARY_API_KEY: placeholder
      CLOUDINARY_API_SECRET: placeholder
      UPSTASH_REDIS_REST_URL: https://placeholder.upstash.io
      UPSTASH_REDIS_REST_TOKEN: placeholder
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: placeholder
      MSW_ENABLED: false
      NEXT_PUBLIC_SENTRY_DSN: "https://27a7b9577764600f09945cc2fe66b2ea7@o4518243603087836.ingest.de.sentry.io/4518243670845456"
      SENTRY_DSN: "https://27a7b9577764600f09945cc2fe66b2ea7@o4518243603087836.ingest.de.sentry.io/4518243670845456"
      SENTRY_ORG: "calendula-herbs-spices-for-exp"
      SENTRY_PROJECT: "calendula-herbs"
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      # Expose git SHA to Next.js build for Sentry release tracking
      NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm prisma generate

      - run: pnpm lint

      - run: pnpm tsc

      - run: pnpm test

      - name: Locale consistency check
        run: node scripts/check-locale-consistency.mjs

      - name: Env var usage check
        run: node scripts/check-env-usage.mjs

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - run: pnpm build

      - name: Create Sentry release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          VERSION=$(git rev-parse --short HEAD)
          npx @sentry/cli releases new "$VERSION" \
            --org "calendula-herbs-spices-for-exp" \
            --project "calendula-herbs"
          npx @sentry/cli releases set-commits "$VERSION" --auto \
            --org "calendula-herbs-spices-for-exp"
          npx @sentry/cli releases finalize "$VERSION" \
            --org "calendula-herbs-spices-for-exp"
          npx @sentry/cli releases deploys "$VERSION" new \
            --env production \
            --org "calendula-herbs-spices-for-exp"

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v7

      - name: Run Lighthouse CI against production
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://calendula-herbscomproject1-production.up.railway.app/
            https://calendula-herbscomproject1-production.up.railway.app/products
            https://calendula-herbscomproject1-production.up.railway.app/contact
          budgetPath: .github/lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true
